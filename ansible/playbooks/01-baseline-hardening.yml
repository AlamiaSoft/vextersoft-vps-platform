---
- name: VexterSoft VPS Baseline Hardening
  hosts: vps_servers
  become: true
  gather_facts: true

  vars:
    admin_user: "vexteradmin"
    swap_size_gb: 4
    swap_file_path: "/swapfile"
    ssh_port: 22

  tasks:
    - name: Verify target OS distribution is Ubuntu 24.04
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_major_version | int == 24
        fail_msg: "This baseline playbook is validated specifically for Ubuntu 24.04 LTS."

    - name: Ensure administrative group exists
      ansible.builtin.group:
        name: "{{ admin_user }}"
        state: present

    - name: Ensure administrative user exists with bash shell
      ansible.builtin.user:
        name: "{{ admin_user }}"
        group: "{{ admin_user }}"
        groups:
          - sudo
        append: true
        shell: /bin/bash
        state: present

    - name: Configure passwordless sudo for administrative user
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/90-{{ admin_user }}"
        content: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"

    - name: Check if swapfile exists
      ansible.builtin.stat:
        path: "{{ swap_file_path }}"
      register: swap_file_stat

    - name: Allocate swapfile
      ansible.builtin.command:
        cmd: "fallocate -l {{ swap_size_gb }}G {{ swap_file_path }}"
        creates: "{{ swap_file_path }}"

    - name: Set secure permissions on swapfile
      ansible.builtin.file:
        path: "{{ swap_file_path }}"
        owner: root
        group: root
        mode: "0600"

    - name: Format swapfile
      ansible.builtin.command:
        cmd: "mkswap {{ swap_file_path }}"
      when: not swap_file_stat.stat.exists
      changed_when: true

    - name: Enable swapfile
      ansible.builtin.command:
        cmd: "swapon {{ swap_file_path }}"
      when: not swap_file_stat.stat.exists
      changed_when: true

    - name: Persist swapfile in /etc/fstab
      ansible.posix.mount:
        name: none
        src: "{{ swap_file_path }}"
        fstype: swap
        opts: sw
        state: present

    - name: Configure memory sysctl tuning (swappiness & cache pressure)
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-vps-tuning.conf
        content: |
          # VexterSoft Virtual Memory Tuning
          vm.swappiness = 10
          vm.vfs_cache_pressure = 50
        owner: root
        group: root
        mode: "0644"
      notify: Reload sysctl

    - name: Install required baseline security and utility packages
      ansible.builtin.apt:
        name:
          - ufw
          - fail2ban
          - unattended-upgrades
          - ca-certificates
          - curl
          - htop
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure IPv6 is enabled in UFW defaults
      ansible.builtin.lineinfile:
        path: /etc/default/ufw
        regexp: '^IPV6='
        line: 'IPV6=yes'
        state: present

    - name: Configure UFW default incoming policy to deny
      community.general.ufw:
        direction: incoming
        default: deny

    - name: Configure UFW default outgoing policy to allow
      community.general.ufw:
        direction: outgoing
        default: allow

    - name: Allow SSH access in UFW
      community.general.ufw:
        rule: allow
        port: "{{ ssh_port }}"
        proto: tcp
        comment: "SSH Administrative Access"

    - name: Enable UFW firewall service
      community.general.ufw:
        state: enabled

    - name: Configure fail2ban jail for SSH
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.d/99-sshd.local
        content: |
          [sshd]
          enabled = true
          port = {{ ssh_port }}
          maxretry = 4
          bantime = 1h
          findtime = 10m
        owner: root
        group: root
        mode: "0644"
      notify: Restart fail2ban

    - name: Configure SSH daemon security hardening
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/99-hardening.conf
        content: |
          # VexterSoft SSH Hardening
          PermitRootLogin prohibit-password
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          MaxAuthTries 4
          X11Forwarding no
        owner: root
        group: root
        mode: "0644"
        validate: "sshd -t -f %s"
      notify: Reload ssh

  handlers:
    - name: Reload sysctl
      ansible.builtin.command:
        cmd: sysctl --system
      changed_when: false

    - name: Restart fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: restarted

    - name: Reload ssh
      ansible.builtin.service:
        name: ssh
        state: reloaded
