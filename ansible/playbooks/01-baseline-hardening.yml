---
- name: VexterSoft VPS Baseline Hardening
  hosts: vps_servers
  become: true
  gather_facts: true

  vars:
    admin_user: "vexteradmin"
    swap_size_gb: 4
    swap_file_path: "/swapfile"
    ssh_port: 22

  pre_tasks:
    - name: Require inventory SSH identity and port to match the baseline configuration
      ansible.builtin.assert:
        that:
          - ansible_user is defined
          - ansible_user == admin_user
          - ansible_port | default(22) | int == ssh_port | int
        fail_msg: >-
          The inventory SSH user/port must explicitly match admin_user and ssh_port.
          Review the target identity and connectivity before applying baseline changes.

  tasks:
    - name: Verify target OS distribution is Ubuntu 24.04
      ansible.builtin.assert:
        that:
          - ansible_facts["distribution"] == "Ubuntu"
          - ansible_facts["distribution_major_version"] | int == 24
        fail_msg: "This baseline playbook is validated specifically for Ubuntu 24.04 LTS."

    - name: Ensure administrative group exists
      ansible.builtin.group:
        name: "{{ admin_user }}"
        state: present

    - name: Ensure administrative user exists with bash shell
      ansible.builtin.user:
        name: "{{ admin_user }}"
        group: "{{ admin_user }}"
        groups:
          - sudo
        append: true
        shell: /bin/bash
        state: present

    - name: Configure passwordless sudo for administrative user
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/90-{{ admin_user }}"
        content: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"

    # --- Robust, Non-Destructive, Idempotent Swap Handling ---
    - name: Query active system swap devices
      ansible.builtin.command:
        cmd: swapon --show=NAME --noheadings
      register: active_swaps
      changed_when: false

    - name: Inspect swapfile state on disk
      ansible.builtin.stat:
        path: "{{ swap_file_path }}"
      register: swap_file_stat

    - name: Detect file type of unactivated swapfile
      ansible.builtin.command:
        cmd: "blkid -c /dev/null -s TYPE -o value {{ swap_file_path }}"
      register: swap_file_type
      changed_when: false
      failed_when: false
      when:
        - swap_file_stat.stat.exists
        - swap_file_path not in active_swaps.stdout_lines

    - name: Guard against destructive replacement of non-swap existing file
      ansible.builtin.fail:
        msg: >
          File {{ swap_file_path }} exists (size: {{ swap_file_stat.stat.size }} bytes)
          but is not recognized as swap type (blkid returned '{{ swap_file_type.stdout | default('') }}').
          Aborting to avoid destructive replacement of existing data.
      when:
        - swap_file_stat.stat.exists
        - swap_file_path not in active_swaps.stdout_lines
        - swap_file_stat.stat.size > 0
        - swap_file_type.stdout != 'swap'

    - name: Allocate swapfile
      ansible.builtin.command:
        cmd: "fallocate -l {{ swap_size_gb }}G {{ swap_file_path }}"
      when:
        - swap_file_path not in active_swaps.stdout_lines
        - not swap_file_stat.stat.exists or swap_file_stat.stat.size == 0
      changed_when: true

    - name: Set secure permissions on swapfile
      ansible.builtin.file:
        path: "{{ swap_file_path }}"
        owner: root
        group: root
        mode: "0600"

    - name: Format swapfile
      ansible.builtin.command:
        cmd: "mkswap {{ swap_file_path }}"
      when:
        - swap_file_path not in active_swaps.stdout_lines
        - not swap_file_stat.stat.exists or swap_file_stat.stat.size == 0
      changed_when: true

    - name: Enable swapfile
      ansible.builtin.command:
        cmd: "swapon {{ swap_file_path }}"
      when:
        - swap_file_path not in active_swaps.stdout_lines
      changed_when: true

    - name: Persist swapfile in /etc/fstab
      ansible.posix.mount:
        name: none
        src: "{{ swap_file_path }}"
        fstype: swap
        opts: sw
        state: present

    - name: Configure memory sysctl tuning (swappiness & cache pressure)
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-vps-tuning.conf
        content: |
          # VexterSoft Virtual Memory Tuning
          vm.swappiness = 10
          vm.vfs_cache_pressure = 50
        owner: root
        group: root
        mode: "0644"
      notify: Reload sysctl

    - name: Install required baseline security and utility packages
      ansible.builtin.apt:
        name:
          - ufw
          - fail2ban
          - unattended-upgrades
          - ca-certificates
          - curl
          - htop
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure IPv6 is enabled in UFW defaults
      ansible.builtin.lineinfile:
        path: /etc/default/ufw
        regexp: '^IPV6='
        line: 'IPV6=yes'
        state: present

    - name: Configure UFW default incoming policy to deny
      community.general.ufw:
        direction: incoming
        default: deny

    - name: Configure UFW default outgoing policy to allow
      community.general.ufw:
        direction: outgoing
        default: allow

    - name: Allow SSH access in UFW
      community.general.ufw:
        rule: allow
        port: "{{ ssh_port }}"
        proto: tcp
        comment: "SSH Administrative Access"

    - name: Enable UFW firewall service
      community.general.ufw:
        state: enabled

    - name: Configure fail2ban jail for SSH
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.d/99-sshd.local
        content: |
          [sshd]
          enabled = true
          port = {{ ssh_port }}
          maxretry = 4
          bantime = 1h
          findtime = 10m
        owner: root
        group: root
        mode: "0644"
      notify: Restart fail2ban

    # --- Effective SSH Configuration Hardening & Verification Gate ---
    # OpenSSH uses the first value read; load this before cloud-init drop-ins.
    - name: Configure SSH daemon security hardening
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-vextersoft-hardening.conf
        content: |
          # VexterSoft SSH Hardening
          PermitRootLogin prohibit-password
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes
          MaxAuthTries 4
          X11Forwarding no
        owner: root
        group: root
        mode: "0644"
        validate: "sshd -t -f %s"
      notify: Reload ssh

    - name: Remove obsolete late-loading VexterSoft SSH hardening drop-in
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/99-hardening.conf
        state: absent
      notify: Reload ssh

    - name: Validate overall SSH daemon syntax
      ansible.builtin.command:
        cmd: sshd -t
      changed_when: false

    - name: Inspect effective SSH configuration for admin user context
      ansible.builtin.command:
        cmd: "sshd -T -C user={{ admin_user }},host=127.0.0.1,addr=127.0.0.1"
      register: sshd_effective_admin
      changed_when: false

    - name: Inspect global effective SSH configuration
      ansible.builtin.command:
        cmd: sshd -T
      register: sshd_effective_global
      changed_when: false

    - name: Verify effective PasswordAuthentication is disabled
      ansible.builtin.assert:
        that:
          - "'passwordauthentication no' in sshd_effective_admin.stdout_lines"
          - "'passwordauthentication no' in sshd_effective_global.stdout_lines"
        fail_msg: "Effective sshd check failed: PasswordAuthentication is not 'no'."

    - name: Verify effective KbdInteractiveAuthentication is disabled
      ansible.builtin.assert:
        that:
          - "'kbdinteractiveauthentication no' in sshd_effective_admin.stdout_lines"
          - "'kbdinteractiveauthentication no' in sshd_effective_global.stdout_lines"
        fail_msg: "Effective sshd check failed: KbdInteractiveAuthentication is not 'no'."

    - name: Verify effective PermitRootLogin prohibits passwords
      ansible.builtin.assert:
        that:
          - >-
            ('permitrootlogin prohibit-password' in sshd_effective_global.stdout_lines)
            or ('permitrootlogin without-password' in sshd_effective_global.stdout_lines)
            or ('permitrootlogin no' in sshd_effective_global.stdout_lines)
        fail_msg: "Effective sshd check failed: PermitRootLogin must prohibit password-based root login (no, prohibit-password, or its without-password alias)."

    - name: Verify effective PubkeyAuthentication is enabled
      ansible.builtin.assert:
        that:
          - "'pubkeyauthentication yes' in sshd_effective_admin.stdout_lines"
          - "'pubkeyauthentication yes' in sshd_effective_global.stdout_lines"
        fail_msg: "Effective sshd check failed: PubkeyAuthentication is not 'yes'."

  handlers:
    - name: Reload sysctl
      ansible.builtin.command:
        cmd: sysctl --system
      changed_when: false

    - name: Restart fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: restarted

    - name: Reload ssh
      ansible.builtin.service:
        name: ssh
        state: reloaded
