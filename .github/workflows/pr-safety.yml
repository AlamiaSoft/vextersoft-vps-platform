name: PR Safety Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-safety-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.2"

      - name: Check whitespace errors
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA"...HEAD

      - name: Validate changed YAML, JSON and repository safety rules
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: python scripts/ci_validate.py

      - name: Scan repository history for leaked secrets
        # No repository secrets are passed to this third-party scanner.
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo"
          -w /repo
          zricethezav/gitleaks:v8.24.2
          git /repo --redact --exit-code 1

      - name: Lint Ansible when infrastructure playbooks are present
        if: hashFiles('ansible/**/*.yml', 'ansible/**/*.yaml') != ''
        run: |
          python -m pip install --disable-pip-version-check ansible-lint
          ansible-lint ansible/
