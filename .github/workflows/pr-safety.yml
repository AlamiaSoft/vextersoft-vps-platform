name: PR Safety Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-safety-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.2" "paramiko>=3.4.0" "Jinja2>=3.1,<4"

      - name: Check whitespace errors
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA"...HEAD

      - name: Validate changed YAML, JSON and repository safety rules
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: python scripts/ci_validate.py

      - name: Run unit and regression tests
        run: |
          if [ -d tests ]; then
            python -m unittest discover -s tests -v
          fi

      - name: Scan repository history for leaked secrets
        # No repository secrets are passed to this third-party scanner.
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo"
          -w /repo
          zricethezav/gitleaks:v8.24.2
          git /repo --redact --exit-code 1

      - name: Lint and syntax check Ansible when infrastructure playbooks are present
        run: |
          if find ansible -type f -name '*.y*ml' -print -quit 2>/dev/null | grep -q .; then
            python -m pip install --disable-pip-version-check ansible-lint ansible-core
            ansible-galaxy collection install -r ansible/requirements.yml
            ansible-lint ansible/
            ansible-playbook --syntax-check -i ansible/inventory/hosts.example.yml ansible/playbooks/01-baseline-hardening.yml
            ansible-playbook --syntax-check -i ansible/inventory/hosts.example.yml ansible/playbooks/03-cloudflared-portainer.yml
          else
            echo "No Ansible playbooks found; skipping Ansible lint."
          fi
